version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: estuplani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estuplani
      POSTGRES_PASSWORD: estuplani_password
      POSTGRES_DB: estuplanidb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estuplani -d estuplanidb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
